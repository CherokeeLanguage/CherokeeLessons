spec:
- round: 1
  date: '2026-11-21T04:09:33Z'
  verdict: FAIL
  findings:
  - id: F-1
    classes: two-readers, internal-contradiction
    finding: R-2 stated the section flow two different ways in one requirement ("...remediation → verification → rollback" vs "rollback SHALL be stated before remediation"); every other surface (Approach, SC-2, remote body) resolved to rollback-before-remediation, making R-2's enumeration the sole dissenting text.
    remediation: R-2 rewritten to the single order "symptom → diagnosis → rollback → remediation → verification"; the redundant duplicate clause removed.
  - id: F-2
    classes: instrument-weaker-than-criterion
    finding: SC-3's criterion required "both observed forms quoted verbatim" but its greps matched substrings shared by the two forms — a page quoting only the heading form would pass.
    remediation: "SC-3's instrument now uses prefix-distinct greps (\"An error occurred: giscus\" for the heading form; \"[giscus] An error occurred\" for the console form)."
  - id: F-3
    classes: prohibition-never-verified
    finding: R-2's "adjust as appropriate" placeholder prohibition was stated but mapped only to SC-2/SC-5, neither of which observed it.
    remediation: SC-2's instrument extended with a page-wide placeholder-language absence grep (adjust as appropriate / adjust as needed / TBD / <insert) = 0; criterion text names the limb.
  - id: F-4
    classes: traceability-overstatement
    finding: R-3's serve-contexts limb (both recorded contexts in the symptom section) was mapped to SC-3, whose instrument could not observe it; SC-4's localhost grep was page-wide.
    remediation: SC-3's instrument extended with symptom-section-scoped greps (127.0.0.1|localhost ≥1 and "deployed domain" ≥1 inside the section slice); criterion names the limb.
  - id: F-5
    classes: instrument-weaker-than-criterion, prohibition-never-verified
    finding: SC-6 observed only branch-(a)'s elements; R-5's branches (b)/(c), the follow-with-verification instruction, and the "SHALL NOT perform tracked-content changes" clause were unobserved.
    remediation: SC-6 broadened — remediation-section-scoped greps for the giscus App install branch, the public/visibility branch, and the verification-follow instruction, plus git status --porcelain empty at the runbook cycle's gate as the SHALL-NOT instrument; criterion restated.
  - id: F-6
    classes: prohibition-never-verified
    finding: R-6's not-bare-localhost caution was never observed — SC-7's greps passed a verification section omitting the caution branch (0) exists to prevent.
    remediation: SC-7's instrument adds a section-scoped "localhost" grep (the caution names the excluded surface); criterion restated.
  - id: F-7
    classes: instrument-weaker-than-criterion
    finding: R-7 required each branch to carry a provenance label; SC-8's page-wide "≥1 per label kind" passed with unlabeled branches.
    remediation: SC-8's instrument made diagnosis-section-scoped with per-branch pairing (≥5 branch markers AND ≥5 label-term occurrences — one per branch); criterion restated.
  - id: F-8
    classes: remote-body-format
    finding: "The remote body lacked the plan-shaped sections remote-body-format requires once a plan exists (Items RED/GREEN, Dependencies, Traceability, Documentation Sources, Enforcement Gate, Cost Frame, Edge Cases, plan Not Included), and its Approach carried the stale \"After approval: plan → implement\" phrase."
    remediation: Remote body 62 rewritten — plan-shaped sections added (items summary, dependencies, traceability, doc-sources pointer, enforcement gate, cost frame, edge cases with the direct-publish N/A-surface note), Approach updated to the plan-exists state; #63's remote body reconciled in the same action (same trigger class — its plan exists too).
  preferences-adjudicated: []
  repo-boundary-containment: pass — single repo (path prefix "."), home store .issues/62

plan:
